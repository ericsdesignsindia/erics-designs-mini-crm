<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client document | Eric's Designs</title><style>body{margin:0;background:#f4f6f2;color:#182018;font:16px/1.5 Arial,sans-serif}.wrap{max-width:860px;margin:40px auto;padding:0 18px}.card{background:#fff;border:1px solid #dce3d8;border-radius:16px;padding:32px;box-shadow:0 12px 35px #1b28100d}.top{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #b99032;padding-bottom:20px}.brand{font:700 24px Georgia,serif;color:#162014}.eyebrow{font-size:12px;letter-spacing:1.7px;color:#92721f;font-weight:bold}.muted{color:#647064}.meta{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:28px 0}.right{text-align:right}table{width:100%;border-collapse:collapse}th{background:#1c281c;color:#fff;text-align:left;font-size:11px;letter-spacing:.6px;padding:10px}td{padding:12px 10px;border-bottom:1px solid #e1e6de;vertical-align:top;font-size:14px}.amount{text-align:right}.total{max-width:320px;margin:24px 0 0 auto}.row{display:flex;justify-content:space-between;padding:8px 0}.grand{font-size:19px;border-top:1px solid #dce3d8;margin-top:8px;padding-top:14px;font-weight:bold}.approve{margin-top:30px;padding:18px;background:#edf5e8;border:1px solid #cfe0c8;border-radius:12px}.approve button{background:#263c22;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;font-size:15px;cursor:pointer}.notice{padding:16px;background:#fff6dc;border-radius:10px}.error{color:#a13b31}@media(max-width:600px){.card{padding:20px}.top,.meta{display:block}.right{text-align:left;margin-top:16px}.meta>div+div{margin-top:20px}th,td{padding:8px 5px;font-size:12px}}</style></head><body><main class="wrap"><section class="card" id="app"><p>Loading your document…</p></section></main><script>const api='https://erics-designs-mini-crm.onrender.com/api',token=new URLSearchParams(location.search).get('token')||'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=(d,n)=>new Intl.NumberFormat(d.currency==='AED'?'en-AE':'en-IN',{style:'currency',currency:d.currency||'INR'}).format(Number(n)||0);function totals(d){const s=d.items.reduce((a,i)=>a+(+i.qty||0)*(+i.rate||0),0),dis=s*(+d.discount||0)/100,net=s-dis,tax=net*(+d.tax||0)/100,paid=(d.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);return{subtotal:s,discount:dis,tax,total:net+tax,paid,balance:net+tax-paid}}async function load(){try{const r=await fetch(api+'/public/portal/'+encodeURIComponent(token));const x=await r.json();if(!r.ok)throw Error(x.error);const d=x.document,t=totals(d),quote=d.type==='Quotation',b=d.business||{};document.title=d.number+' | Eric’s Designs';document.getElementById('app').innerHTML=`<div class="top"><div><div class="brand">${esc(b.name||"Eric's Designs")}</div><div class="muted">${esc(b.tagline||'')}</div></div><div class="right"><div class="eyebrow">${esc(d.type)}</div><b>${esc(d.number)}</b></div></div><div class="meta"><div><div class="eyebrow">${quote?'PREPARED FOR':'BILL TO'}</div><b>${esc(d.client.name)}</b><br>${esc(d.client.contact||'')}<br>${esc(d.client.address||'')}</div><div class="right"><div class="eyebrow">DETAILS</div>Issue date: ${esc(d.date)}<br>${quote?'Valid until':'Due date'}: ${esc(d.due)}<br>Project: ${esc(d.project||'—')}</div></div><div class="eyebrow">${quote?'SERVICES QUOTED':'SERVICES PROVIDED'}</div><table><thead><tr><th>Service / description</th><th class="amount">Qty</th><th class="amount">Rate</th><th class="amount">Amount</th></tr></thead><tbody>${d.items.map(i=>`<tr><td><b>${esc(i.name)}</b><br><span class="muted">${esc(i.description||'')}</span></td><td class="amount">${esc(i.qty)}</td><td class="amount">${fmt(d,i.rate)}</td><td class="amount">${fmt(d,(+i.qty||0)*(+i.rate||0))}</td></tr>`).join('')}</tbody></table><div class="total"><div class="row"><span>Subtotal</span><span>${fmt(d,t.subtotal)}</span></div><div class="row"><span>Tax</span><span>${fmt(d,t.tax)}</span></div><div class="row grand"><span>Total</span><span>${fmt(d,t.total)}</span></div>${!quote?`<div class="row"><span>Balance due</span><b>${fmt(d,t.balance)}</b></div>`:''}</div>${quote&&d.status==='Sent'?`<div class="approve"><b>Ready to proceed?</b><p>By approving, you confirm acceptance of this quotation and its terms.</p><button id="approve">Approve quotation</button><p class="muted" id="result"></p></div>`:`<div class="notice">Status: <b>${esc(d.status)}</b></div>`}`;const button=document.getElementById('approve');if(button)button.onclick=async()=>{if(!confirm('Approve this quotation?'))return;button.disabled=true;const r=await fetch(api+'/public/portal/'+encodeURIComponent(token)+'/approve',{method:'POST'}),x=await r.json();document.getElementById('result').textContent=x.message||x.error||'Unable to approve.';if(r.ok)button.remove()}}catch(e){document.getElementById('app').innerHTML='<p class="error">'+esc(e.message||'This document link is unavailable.')+'</p>'}}load()</script></body></html>
