<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start a Project | Eric's Designs</title><link rel="icon" href="./favicon-32.png"><style>body{margin:0;background:#11130e;color:#f4f0e6;font:16px Arial,sans-serif}.wrap{max-width:680px;margin:0 auto;padding:42px 20px 70px}.brand{color:#d8b45d;font-weight:700;letter-spacing:.08em}.card{background:#1b1e17;border:1px solid #393d30;border-radius:20px;padding:30px;margin-top:25px}h1{font-size:clamp(30px,6vw,50px);margin:10px 0}p{color:#c4c5be;line-height:1.55}label{display:block;margin:16px 0 7px;font-weight:700}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid #4b5042;border-radius:10px;background:#11130e;color:#fff;padding:13px;font:inherit}textarea{min-height:130px;resize:vertical}button{margin-top:22px;width:100%;border:0;border-radius:10px;padding:14px;background:#d8b45d;color:#17150d;font-weight:800;font-size:16px;cursor:pointer}.note{font-size:13px}.success{display:none;padding:16px;border-radius:10px;background:#263421;color:#d9efc7;margin-top:18px}.error{color:#ffaaa0;margin-top:12px}</style></head><body><main class="wrap"><div class="brand">ERIC'S DESIGNS</div><h1>Tell us about your project.</h1><p>Share what you need and we will contact you with the next steps.</p><section class="card"><form id="leadForm"><label for="name">Company or name</label><input id="name" required><label for="contact">Contact person</label><input id="contact"><label for="email">Email</label><input id="email" type="email"><label for="phone">WhatsApp number</label><input id="phone" inputmode="tel"><label for="service">Service needed</label><select id="service"><option value="">Select a service</option><option>Web Development</option><option>E-commerce Website</option><option>Digital Marketing</option><option>SEO</option><option>Full Stack Development</option><option>AI Automation</option><option>WhatsApp Automation Setup</option><option>Brand Solution</option><option>Creative Designing</option><option>Content Writing</option><option>Other</option></select><label for="message">Project details</label><textarea id="message" required placeholder="What would you like to create or improve?"></textarea><button>Send enquiry</button><p class="note">Your details are used only to respond to this enquiry.</p><p id="error" class="error" role="alert"></p><div id="success" class="success">Thank you. Your enquiry has reached Eric's Designs.</div></form></section></main><script>const source=new URLSearchParams(location.search).get('source')||'Website';document.getElementById('leadForm').onsubmit=async e=>{e.preventDefault();const error=document.getElementById('error'),button=e.target.querySelector('button');error.textContent='';const data={name:name.value,contact:contact.value,email:email.value,phone:phone.value,service:service.value,message:message.value,source};if(!data.email&&!data.phone){error.textContent='Add an email address or WhatsApp number.';return}button.disabled=true;button.textContent='Sending...';try{const r=await fetch('https://erics-designs-mini-crm.onrender.com/api/public/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),body=await r.json();if(!r.ok)throw Error(body.error||'Unable to send your enquiry.');e.target.reset();document.getElementById('success').style.display='block'}catch(err){error.textContent=err.message}finally{button.disabled=false;button.textContent='Send enquiry'}}</script></body></html>
