services:
  - type: web
    name: erics-designs-erp-api
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ericsdesignsindia.github.io,https://crm.ericsdesigns.in,capacitor://localhost,ionic://localhost,http://localhost,https://localhost
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://erics-designs-mini-crm.onrender.com/api/integrations/google-drive/callback
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: META_APP_ID
        value: 1428706729188935
      - key: META_APP_SECRET
        sync: false
      - key: META_ADS_REDIRECT_URI
        value: https://crm.ericsdesigns.in/api/integrations/meta-ads/callback
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: FRONTEND_URL
        value: https://ericsdesignsindia.github.io/erics-designs-mini-crm/
